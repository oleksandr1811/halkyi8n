name: Build Pages

on:
  push:
    branches:
      - master
    paths:
      - '**.ts'
      - '**.sh'
      - '.github/CNAME'
      - 'release.sh'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Build translations
        run: |
          nix develop . -c ./release.sh

      - name: Prepare site folder
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r build/. _site/ || true
          cp .github/CNAME _site/CNAME || true

          # 🔥 FORCE CHANGE (важливо!)
          echo "build: $(date -u)" > _site/.build-info

      - name: Show output debug
        run: |
          ls -lah _site
          find _site -type f | head -50

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          keep_files: false
